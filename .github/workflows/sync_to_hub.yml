name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to hub
        # We use the secret directly here to avoid shell variable issues
        run: git push --force https://Arsenal2004:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Arsenal2004/Sql_auto main
